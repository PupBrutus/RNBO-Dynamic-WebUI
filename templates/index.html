<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>RNBO Control Server</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='styles.css') }}">
    <script>
        // Injected by Flask; read by static/app.js
        window.RNBO_CONFIG = {
            server: "{{ server }}",
            queryPort: "{{ data_retrieve_port }}"
        };
    </script>
    <script src="{{ url_for('static', filename='app.js') }}" defer></script>
</head>
<body>
    <header class="header">
        <h1>RNBO Control</h1>
        <div class="header-meta">
            <span class="server-label">Runner <code id="serverName">{{ server }}</code></span>
            <span class="status" id="status"></span>
            <button type="button" class="btn btn-ghost" id="refreshButton">Refresh</button>
        </div>
    </header>
    <main class="card-grid" id="parameterControls"></main>
</body>
</html>
